name: Validate Election Atlas
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: node --check server.mjs
      - run: node --check public/app.js
      - run: node --check lib/adapters.mjs
      - run: node --check lib/candidate-rosters.mjs
      - run: node --check lib/portrait-enrichment.mjs
      - run: node --check lib/verified-portraits.mjs
      - run: node --check lib/wikidata-portraits.mjs
      - name: Inspect optional FEC candidate IDs for future portrait matching
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/probe-federal-candidate-ids.mjs
      - name: Probe Wikimedia Commons photo license metadata
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/probe-commons-metadata.mjs
      - name: Probe Wikidata FEC ID to Commons portrait availability
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/probe-wikidata-fec.mjs
      - name: Probe optional live portrait provider contract
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/probe-portrait-provider.mjs
